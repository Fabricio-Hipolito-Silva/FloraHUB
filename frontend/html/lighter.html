<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lighter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <link rel="stylesheet" href="../css/lighter.css">
</head>
<body>
    <a href="/"><button>Voltar</button></a>
    <br><br>
    <h1>Lighter</h1>
  <br><br>
    <ul class="nav nav-tabs" id="myTab" role="tablist">
  <li class="nav-item" role="presentation">
    <button class="nav-link active" id="white-tab" data-bs-toggle="tab" data-bs-target="#white" type="button" role="tab" aria-controls="white" aria-selected="true">Branco</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="color-tab" data-bs-toggle="tab" data-bs-target="#color" type="button" role="tab" aria-controls="color" aria-selected="false">Colorido</button>
  </li>
    </ul>
<div class="tab-content" id="myTabContent">
  <div class="tab-pane fade show active" id="white" role="tabpanel" aria-labelledby="white-tab"> </div>
  <div class="tab-pane fade" id="color" role="tabpanel" aria-labelledby="color-tab">
        <br>
        <div id="picker"></div>
        <br>
        <br>
  </div>
  <br>

    <br>
    <div id="brightnessControl">
    <label for="brightness">Brilho</label>
    <input
        id="brightness"
        type="range"
        min="10"
        max="1000"
        value="500" 
    />
      <br>
      <br>
    <label for="temperature">Temperatura</label>
    <input
        id="temperature"
        type="range"
        min="0"
        max="1000"
        value="500" 
    />  
  </div>
  <br> <br>
  <label class="switch">
  <input id="power" type="checkbox">
  <span class="slider round"></span>
</label>
    <script src="../js/lighter.js"></script>
</body>
</html>
